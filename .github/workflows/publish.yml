name: Deploy to GitHub Pages

# Trigger workflow on push to source branch
on:
  push:
    branches:
      - source  # Or any branch you're using for development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v7

    # Step 2: Set up Ruby and install gems
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    # Step 3: Build the Jekyll site
    - name: Build site
      run: bundle exec jekyll build

    # Step 4: Deploy to GitHub Pages (sync to `gh-pages` branch)
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site  # Directory where your built static site is located (adjust to your project structure)
