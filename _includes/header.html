<header>

    <!-- Nav Bar -->
    <nav id="navbar" class="navbar navbar-light bg-white navbar-expand-sm">
    <div class="container">
      <!-- Navbar Toggle -->
      <button class="navbar-toggler collapsed ml-auto" type="button"
      data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle
      navigation">
        <span class="navbar-toggler-icon small"></span>
      </button>
      <div class="collapse navbar-collapse text-right" id="navbarNav">
        <ul class="navbar-nav ml-auto flex-nowrap">
          <!-- Home -->
          <li class="nav-item {% if page.title == 'Home' %}active{% endif %}">
            <a class="nav-link" href="{{ '/' | relative_url }}">
              Home
            </a>
          </li>
          {% if site.blog_name %}
          <!-- Blog -->
          <li class="nav-item {% if page.url contains 'blog' %}active{% endif %}">
            <a class="nav-link" href="{{ '/blog/' | relative_url }}">
              blog
            </a>
          </li>
          {% endif %}
          <!-- Other pages -->
          {% assign sorted_pages = site.pages | sort: "title" %}
          {% for p in sorted_pages %}
          {% if p.nav and p.autogen == nil %}
          <li class="nav-item {% if page.title == p.title %}active{% endif %}">
              <a class="nav-link" href="{{ p.url | relative_url }}">
                {{ p.title }}
              </a>
          </li>
          {% endif %}
          {% endfor %}
        </ul>
      </div>
    </div>
  </nav>

</header>
